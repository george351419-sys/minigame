<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幸运数字预言</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff8f0;
      --surface: #ffffff;
      --ink: #2d1f14;
      --muted: #7a6558;
      --accent: #ff6b4a;
      --accent-soft: #ffe8e2;
      --bit-on: #1a9b8a;
      --bit-on-glow: rgba(26, 155, 138, 0.35);
      --bit-off: #e8ddd4;
      --tens: #4a7cff;
      --ones: #e85d9a;
      --shadow: 0 12px 40px rgba(45, 31, 20, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 20%, #ffe4c8 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, #c8f0ea 0%, transparent 40%),
        var(--bg);
      line-height: 1.6;
    }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeUp 0.7s ease both;
    }

    h1 {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: var(--muted);
      font-size: 1rem;
      max-width: 28em;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.75rem;
      margin-bottom: 1.25rem;
      animation: fadeUp 0.7s ease both;
    }

    .card:nth-child(2) { animation-delay: 0.08s; }
    .card:nth-child(3) { animation-delay: 0.16s; }
    .card:nth-child(4) { animation-delay: 0.24s; }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* Bit input row */
    .bits-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      align-items: flex-start;
    }

    .bit-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .bit-group-label {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 1.1rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    .bit-group.tens .bit-group-label {
      background: rgba(74, 124, 255, 0.12);
      color: var(--tens);
    }

    .bit-group.ones .bit-group-label {
      background: rgba(232, 93, 154, 0.12);
      color: var(--ones);
    }

    .bits {
      display: flex;
      gap: 0.5rem;
    }

    .bit-btn {
      width: 56px;
      height: 72px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 1.75rem;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
      position: relative;
    }

    .bit-btn:hover {
      transform: translateY(-3px);
    }

    .bit-btn:active {
      transform: translateY(0) scale(0.97);
    }

    .bit-btn[data-value="0"] {
      background: #ff4757;
      color: #fff;
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.35);
    }

    .bit-btn[data-value="1"] {
      background: linear-gradient(145deg, #22b5a3, var(--bit-on));
      color: #fff;
      box-shadow: 0 6px 20px var(--bit-on-glow);
    }

    .bit-index {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      font-family: "Noto Sans SC", sans-serif;
      font-weight: 600;
      opacity: 0.5;
    }

    .divider {
      width: 2px;
      align-self: stretch;
      min-height: 80px;
      background: linear-gradient(to bottom, transparent, var(--bit-off), transparent);
      margin: 0 0.25rem;
    }

    /* Text input fallback */
    .text-input-row {
      margin-top: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
    }

    .text-input-row label {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .binary-input {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 1.5rem;
      letter-spacing: 0.35em;
      width: 11em;
      padding: 0.5rem 0.75rem;
      border: 2px solid var(--bit-off);
      border-radius: 12px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    .binary-input::placeholder {
      color: var(--bit-off);
      letter-spacing: 0.35em;
    }

    .binary-input:focus {
      border-color: var(--bit-on);
    }

    .binary-input.invalid {
      border-color: var(--accent);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Calculation section with result first */
    .calc-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 2px dashed var(--bit-off);
    }

    .calc-header .section-label {
      margin-bottom: 0;
    }

    .result-inline {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.15rem;
    }

    .result-inline .result-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0;
    }

    .result-inline .result-number {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: clamp(2.5rem, 10vw, 3.5rem);
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 3px 0 rgba(255, 107, 74, 0.2);
    }

    .result-inline .result-number.pop {
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result-inline .result-number.empty {
      color: var(--bit-off);
      text-shadow: none;
      font-size: 2rem;
    }

    /* Conversion steps */
    .steps {
      display: grid;
      gap: 1rem;
    }

    .step {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-radius: 14px;
      background: var(--bg);
    }

    .step.tens { border-left: 4px solid var(--tens); }
    .step.ones { border-left: 4px solid var(--ones); }

    .step-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .step.tens .step-badge { background: rgba(74, 124, 255, 0.15); color: var(--tens); }
    .step.ones .step-badge { background: rgba(232, 93, 154, 0.15); color: var(--ones); }

    .binary-str {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 1.35rem;
      letter-spacing: 0.15em;
    }

    .arrow {
      color: var(--muted);
      font-size: 1.25rem;
    }

    .decimal {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 1.5rem;
      color: var(--bit-on);
    }

    .place-hint {
      font-size: 0.85rem;
      color: var(--muted);
      width: 100%;
      margin-top: 0.25rem;
    }

    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0.5; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    .formula {
      margin-top: 1rem;
      font-size: 1rem;
      color: var(--muted);
      text-align: center;
    }

    .formula strong {
      color: var(--ink);
    }

    /* Actions */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .btn {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 16px rgba(255, 107, 74, 0.35);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--bit-off);
    }

    /* Learn panel */
    .learn p {
      margin-bottom: 0.75rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .learn p:last-child {
      margin-bottom: 0;
    }

    .learn em {
      font-style: normal;
      background: var(--accent-soft);
      padding: 0.1em 0.35em;
      border-radius: 4px;
      color: var(--accent);
      font-weight: 600;
    }

    .example-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.5rem;
      padding: 0.5rem 0.85rem;
      background: var(--bg);
      border-radius: 10px;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      animation: fadeUp 0.7s 0.32s ease both;
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <h1>幸运数字预言</h1>
      <p class="tagline">欢迎来到幸运数字预言，摇出竹签后，任选一个竹签上你喜欢的数字，我能预言出你选中的数字哦！</p>
    </header>

    <section class="card">
      <h2 class="section-label">玩法说明</h2>
      <p style="color: var(--muted); font-size: 0.95rem; line-height: 1.8;">
        选择竹签上的一个数字，偷偷改掉它对应的形状，不要更改其他数字的形状，然后依次点选六个形状，例：■○○■○■。<br><br>
        然后点击"预言幸运数字"就能看到结果！
      </p>
    </section>

    <section class="card" aria-labelledby="input-heading">
      <h2 id="input-heading" class="section-label">选择形状</h2>
      <p style="color: var(--muted); font-size: 0.85rem; text-align: center; margin-bottom: 1rem;">点击形状切换</p>
      <div class="bits-row" id="bits-ui">
        <div class="bit-group tens">
          <div class="bits" id="bits-tens"></div>
        </div>
        <div class="divider" aria-hidden="true"></div>
        <div class="bit-group ones">
          <div class="bits" id="bits-ones"></div>
        </div>
      </div>
      
      <div class="actions">
        <button type="button" class="btn btn-secondary" id="btn-random">摇竹签</button>
        <button type="button" class="btn btn-primary" id="btn-decode">预言幸运数字</button>
      </div>
    </section>

    <section class="card" id="result-card" aria-labelledby="result-heading" aria-live="polite" aria-atomic="true" style="display: none;">
      <div class="result-inline" style="justify-content: center; align-items: center;">
        <p class="result-label">预言结果</p>
        <div class="result-number" id="result">77</div>
      </div>
    </section>

    
  </div>

  <script>
    const DEFAULT_BITS = "111111";
    let bits = DEFAULT_BITS.split("");

    const bitsTensEl = document.getElementById("bits-tens");
    const bitsOnesEl = document.getElementById("bits-ones");
    const resultEl = document.getElementById("result");
    const resultCardEl = document.getElementById("result-card");

    function bitToSymbol(bit) {
      return bit === "1" ? "■" : "○";
    }

    function decode(bitsStr) {
      const tensBin = bitsStr.slice(0, 3);
      const onesBin = bitsStr.slice(3, 6);
      const tens = parseInt(tensBin, 2);
      const ones = parseInt(onesBin, 2);
      const result = tens * 10 + ones;
      return { result };
    }

    function isValidBinary6(str) {
      return /^[01]{6}$/.test(str);
    }

    function renderBitButtons() {
      bitsTensEl.innerHTML = "";
      bitsOnesEl.innerHTML = "";
      for (let i = 0; i < 6; i++) {
        const container = i < 3 ? bitsTensEl : bitsOnesEl;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "bit-btn";
        btn.dataset.index = String(i);
        btn.dataset.value = bits[i];
        btn.setAttribute("aria-label", `第 ${i + 1} 位，当前为 ${bits[i] === "1" ? "方" : "圆"}，点击切换`);
        btn.textContent = bitToSymbol(bits[i]);
        const idx = document.createElement("span");
        idx.className = "bit-index";
        idx.textContent = i + 1;
        btn.appendChild(idx);
        btn.addEventListener("click", () => toggleBit(i));
        container.appendChild(btn);
      }
    }

    function toggleBit(index) {
      bits[index] = bits[index] === "1" ? "0" : "1";
      renderBitButtons();
    }

    function getActiveBitsStr() {
      return bits.join("");
    }

    function syncFromBits(animate) {
      updateUI(bits.join(""), animate);
    }

    function updateUI(bitsStr, animate) {
      if (!isValidBinary6(bitsStr)) return;

      const { result } = decode(bitsStr);

      resultEl.textContent = result;

      if (animate) {
        resultEl.classList.remove("pop");
        void resultEl.offsetWidth;
        resultEl.classList.add("pop");
      }
    }

    function setBits(str) {
      if (!isValidBinary6(str)) return;
      bits = str.split("");
      renderBitButtons();
    }

    document.getElementById("btn-decode").addEventListener("click", () => {
      const str = getActiveBitsStr();
      if (isValidBinary6(str)) {
        resultCardEl.style.display = "block";
        updateUI(str, true);
      }
    });

    document.getElementById("btn-random").addEventListener("click", () => {
      let str = "";
      for (let i = 0; i < 6; i++) {
        str += Math.random() < 0.5 ? "0" : "1";
      }
      resultCardEl.style.display = "none";
      setBits(str);
    });

    renderBitButtons();
  </script>
</body>
</html>
